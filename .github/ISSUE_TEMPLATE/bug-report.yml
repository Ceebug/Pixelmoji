name: "🐛 Bug Report"
description: "File a structured bug report for the project."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: "What is the bug?"
      description: "Provide a clear and concise description of what the bug is and what currently happens."
      placeholder: "e.g. When I click the button, the profile picture disappears..."
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: "What is the expected behaviour?"
      description: "Tell us what should have happened instead if the code was working perfectly."
      placeholder: "e.g. The profile picture should stay visible and open the context menu..."
    validations:
      required: true
