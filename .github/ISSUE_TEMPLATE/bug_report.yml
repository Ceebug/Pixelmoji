name: "🐛 Bug Report"
description: "File a structured bug report for the project."
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: "What is the texture or rendering bug?"
      description: "Provide a clear description of what is visually broken and what currently happens in-game."
      placeholder: "e.g. The emoji has a black background instead of being transparent, or turns into a missing texture block..."
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: "What is the expected behavior?"
      description: "Describe what the emoji texture should look like when rendering correctly."
      placeholder: "e.g. The texture should render as a crisp flat image with complete transparency around the edges..."
    validations:
      required: true
