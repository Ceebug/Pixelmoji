name: "🐛 Bug Report"
description: "File a structured bug report for the project."
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: "What is the bug?"
      description: "Provide a clear and concise description of what the bug is and what currently happens."
      placeholder: "e.g. When I click the button, the profile picture disappears..."
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: "What is the expected behaviour?"
      description: "Describe what the application should do when functioning correctly."
      placeholder: "e.g. The profile picture should remain visible and open the context menu..."
    validations:
      required: true
